<svg width="46" height="46" viewBox="0 0 46 46" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Badge background -->
  <rect x="0.5" y="0.5" width="45" height="45" rx="12" fill="#991B1B" />
  <!-- Subtle inner border -->
  <rect x="2.5" y="2.5" width="41" height="41" rx="10" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1" />
  <!-- Road perspective: left edge -->
  <line x1="9" y1="30" x2="23" y2="11" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.9" />
  <!-- Road perspective: right edge -->
  <line x1="37" y1="30" x2="23" y2="11" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.9" />
  <!-- Horizon cap line -->
  <line x1="19.5" y1="11" x2="26.5" y2="11" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.45" />
  <!-- Road centre dashes -->
  <line x1="23" y1="24" x2="23" y2="21" stroke="white" stroke-width="1.6" stroke-linecap="round" opacity="0.7" />
  <line x1="23" y1="29" x2="23" y2="27" stroke="white" stroke-width="1.6" stroke-linecap="round" opacity="0.45" />
  <!-- IJT monogram -->
  <text
    x="23" y="40"
    text-anchor="middle"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="11"
    letter-spacing="2.5"
    fill="white"
    opacity="0.95"
  >IJT</text>
</svg>
