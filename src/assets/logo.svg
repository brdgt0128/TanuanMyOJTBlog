<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffe080"/>
      <stop offset="50%"  stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#c4820d"/>
    </linearGradient>
    <radialGradient id="bg" cx="40%" cy="35%" r="68%">
      <stop offset="0%"   stop-color="#1e1c0a"/>
      <stop offset="100%" stop-color="#080806"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Badge background -->
  <rect width="120" height="120" rx="18" fill="url(#bg)"/>

  <!-- Border -->
  <rect width="120" height="120" rx="18" fill="none" stroke="#f5a623" stroke-width="1.5" opacity="0.25"/>
  <rect x="3" y="3" width="114" height="114" rx="15.5" fill="none" stroke="#ffe080" stroke-width="0.5" opacity="0.1"/>

  <!-- Corner accents -->
  <g stroke="#f5a623" stroke-width="1.5" stroke-linecap="round" opacity="0.4">
    <line x1="11" y1="11" x2="20" y2="11"/><line x1="11" y1="11" x2="11" y2="20"/>
    <line x1="109" y1="11" x2="100" y2="11"/><line x1="109" y1="11" x2="109" y2="20"/>
    <line x1="11" y1="109" x2="20" y2="109"/><line x1="11" y1="109" x2="11" y2="100"/>
    <line x1="109" y1="109" x2="100" y2="109"/><line x1="109" y1="109" x2="109" y2="100"/>
  </g>

  <!-- ── Letter A ── -->
  <g filter="url(#glow)" stroke="url(#sg)" stroke-linecap="round" stroke-linejoin="round" stroke-width="7.5" fill="none">
    <!-- Left leg -->
    <line x1="11" y1="95" x2="38" y2="15"/>
    <!-- Right leg -->
    <line x1="38" y1="15" x2="65" y2="95"/>
    <!-- Crossbar (at ~55% of height between y15–y95) -->
    <line x1="21" y1="59" x2="55" y2="59"/>
  </g>

  <!-- ── Letter T ── -->
  <g filter="url(#glow)" stroke="url(#sg)" stroke-linecap="round" stroke-linejoin="round" stroke-width="7.5" fill="none">
    <!-- Top bar -->
    <line x1="69" y1="15" x2="109" y2="15"/>
    <!-- Stem (centred on top bar) -->
    <line x1="89" y1="15" x2="89" y2="95"/>
  </g>
</svg>
